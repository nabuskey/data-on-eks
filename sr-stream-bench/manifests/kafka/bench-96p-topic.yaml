apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: bench96
  namespace: kafka
  labels:
    strimzi.io/cluster: data-on-eks
spec:
  # 96 partitions, 16 per broker across 6 brokers.
  partitions: 96
  replicas: 3
  config:
    retention.ms: 3600000
    max.message.bytes: 10485760
