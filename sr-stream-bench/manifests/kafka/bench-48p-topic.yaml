apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: bench48
  namespace: kafka
  labels:
    strimzi.io/cluster: data-on-eks
spec:
  # 48 partitions, 8 per broker across 6 brokers.
  partitions: 48
  replicas: 3
  config:
    retention.ms: 3600000
    max.message.bytes: 10485760
