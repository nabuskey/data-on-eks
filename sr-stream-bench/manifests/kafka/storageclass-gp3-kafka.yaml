apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-kafka
provisioner: ebs.csi.aws.com
# Bind the volume only when a pod needs it. This picks the right zone.
volumeBindingMode: WaitForFirstConsumer
# Allow the volume to grow later.
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  # Provisioned throughput in MB/s. The gp3 maximum is 1000.
  throughput: "1000"
  # Provisioned IOPS. gp3 needs at least 4000 IOPS to reach 1000 MB/s.
  iops: "10000"
  encrypted: "true"
  fsType: xfs
